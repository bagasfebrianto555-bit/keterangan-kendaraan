<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keterangan Kendaraan - G 8168 OC</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef1f4;color:#17202a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.header{background:#17202a;color:#fff;padding:26px 24px}
.header .tag{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.header h1{margin:8px 0 5px;font-size:32px}
.header p{margin:0;opacity:.8}
.content{padding:22px 24px}
.row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #e5e7eb}
.label{color:#6b7280;font-size:14px}
.value{text-align:right;font-weight:700;max-width:65%;word-break:break-word}
.qr{margin-top:22px;border:1px solid #e5e7eb;border-radius:15px;padding:18px;text-align:center;background:#fafafa}
#qrcode{width:190px;height:190px;margin:auto}
#qrcode img,#qrcode canvas{max-width:190px;height:auto}
.qr p{font-size:12px;color:#6b7280;margin:12px 0 0}
button{margin-top:16px;width:100%;border:0;border-radius:11px;padding:13px;background:#17202a;color:#fff;font-weight:bold;font-size:14px}
.footer{text-align:center;color:#9ca3af;font-size:11px;padding:0 24px 22px}
@media print{body{background:#fff;padding:0}.card{box-shadow:none}button{display:none}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="tag">Keterangan Kendaraan</div>
    <h1>G 8168 OC</h1>
    <p>Informasi kendaraan</p>
  </div>

  <div class="content">
    <div class="row"><span class="label">Nomor Polisi</span><span class="value">G 8168 OC</span></div>
    <div class="row"><span class="label">Nomor Rangka</span><span class="value">MHMFE74PKHAGDN</span></div>
    <div class="row"><span class="label">Nomor Mesin</span><span class="value">4D34FEH0BN</span></div>
    <div class="row"><span class="label">Merk</span><span class="value">Mitsubishi</span></div>
    <div class="row"><span class="label">Tahun Pembuatan</span><span class="value">2008</span></div>
    <div class="row"><span class="label">Penanggung Jawab</span><span class="value">Pak Agus</span></div>

    <div class="qr">
      <div id="qrcode"></div>
      <p>Scan QR Code untuk membuka halaman kendaraan.</p>
      <button onclick="window.print()">Cetak / Simpan PDF</button>
    </div>
  </div>

  <div class="footer">Dokumen informasi kendaraan</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url = window.location.href;
new QRCode(document.getElementById("qrcode"), {
  text: url.startsWith("http") ? url : "G 8168 OC | Mitsubishi | Tahun 2008",
  width: 190,
  height: 190,
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
